name: Sync to Hugging Face Hub (DEMO SPACE)

# IMPORTANT: this repo (titan-omega-infinity) deploys to the PUBLIC GUEST DEMO
# space — NOT the founder's production space. The production space is fed only
# by the original AbdullahRathoreVA/Project-titan-omega repo. Keeping these
# separate is what stops the commercial fork from ever clobbering the live app.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face demo space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # HF rejects plain-git binaries (Xet policy), so deploy a single clean
        # commit with any media stripped.
        run: |
          rm -rf docs/media
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy $GITHUB_SHA"
          git push --force https://careermind2026:$HF_TOKEN@huggingface.co/spaces/careermind2026/titan-omega-demo hf-deploy:main
