name: Sync to Hugging Face Hub (DEMO SPACE)

# Deploys this fork to the PUBLIC GUEST DEMO space using GitHub OIDC via a
# Hugging Face "Trusted Publisher" configured on the Space — NO HF token is
# stored anywhere. It never targets the founder's production space (that one is
# fed only by the original Project-titan-omega repo).
#
# Requires (already set on the Space):
#   - Trusted Publisher: repo=AbdullahRathoreVA/titan-omega-infinity,
#     branch=main, workflow=huggingface-sync.yml
#   - Variables: TITAN_GUEST_MODE=1, TITAN_REQUIRE_AUTH=0 (no API keys)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets huggingface_hub exchange the GitHub OIDC token
  contents: read

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hf CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload to the demo Space (token-less OIDC)
        env:
          # Scope the short-lived OIDC token to the demo Space only.
          # NB: a Space resource MUST be prefixed "spaces/" — a bare id is
          # treated as a model repo and the exchange fails with "not found".
          HF_OIDC_RESOURCE: spaces/careermind2026/titan-omega-demo
        run: |
          # Don't ship git internals, workflows, or heavy demo media to the Space.
          rm -rf .git .github docs/media
          hf upload careermind2026/titan-omega-demo . . \
            --repo-type=space \
            --commit-message "Deploy ${GITHUB_SHA}"
